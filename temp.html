<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptotix - Book Movies with Crypto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#181524] to-[#09090F] text-white font-sans">

    <!-- Navbar -->
    <nav class="flex justify-between items-center p-5">
        <h1 class="text-xl font-bold text-yellow-400">CRYPTOTIX</h1>
        <button class="bg-purple-500 px-4 py-2 rounded-md">Connect Wallet</button>
    </nav>

    <!-- Hero Section -->
    <section class="text-center py-20">
        <h1 class="text-4xl font-bold">Book Movies With Crypto</h1>
        <p class="text-lg mt-2">SAVE UP TO 60%</p>
        <button class="mt-5 bg-purple-500 px-6 py-3 rounded-md">Explore Now</button>
        
        <!-- Featured Movie -->
        <div class="mt-10 mx-auto max-w-sm bg-gray-900 p-5 rounded-lg text-left">
            <img src="spiderman.jpg" alt="Spiderman" class="rounded-md">
            <p class="mt-2">Current Price: <span class="text-yellow-400">20.88 ETH</span></p>
            <p>Movie Time: <span class="text-green-400">08:24:11</span></p>
        </div>
    </section>

    <!-- Now Showing -->
    <section class="py-20 text-center">
        <h2 class="text-2xl font-bold">Now Showing</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mt-5 mx-auto max-w-4xl">
            <div><img src="furiosa.jpg" alt="Furiosa" class="rounded-md"></div>
            <div><img src="if.jpg" alt="IF" class="rounded-md"></div>
            <div><img src="civil-war.jpg" alt="Civil War" class="rounded-md"></div>
            <div><img src="planet-apes.jpg" alt="Planet of the Apes" class="rounded-md"></div>
        </div>
        <button class="mt-5 text-blue-400 underline">Show All →</button>
    </section>

    <!-- Footer -->
    <footer class="py-10 text-center">
        <h2 class="text-yellow-400 text-lg">CRYPTOTIX</h2>
        <button class="mt-3 bg-blue-500 px-4 py-2 rounded-md">Contact For Partnership</button>
        <div class="mt-3">
            <a href="#" class="mx-2">🔗 LinkedIn</a>
            <a href="#" class="mx-2">🔗 Facebook</a>
            <a href="#" class="mx-2">🔗 Twitter</a>
        </div>
    </footer>

</body>
</html>
